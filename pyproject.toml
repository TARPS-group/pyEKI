[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyeki"
version = "0.1.0.dev0"
description = "Ensemble Kalman Inversion for derivative-free Bayesian calibration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew Roberts", email = "agr.roberts@gmail.com" }]
keywords = [
    "ensemble kalman inversion",
    "data assimilation",
    "bayesian inference",
    "uncertainty quantification",
    "derivative-free optimization",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "jax>=0.4",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/TARPS-group/pyEKI"
Documentation = "https://tarps-group.github.io/pyEKI/"
Repository = "https://github.com/TARPS-group/pyEKI"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "sphinx>=7.0",
    "furo>=2024.1",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "nbsphinx>=0.9",
    "ipykernel>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pyeki"]

[tool.ruff]
target-version = "py311"
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
# N803/N806: mathematical code uses capitals for matrices (A, L, X) by convention.
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
